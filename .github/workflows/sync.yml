# .github/workflows/sync.yml
# ==========================================
# ReleaseForge - Automated Publishing Pipeline
# ==========================================
#
# Why this file exists:
# This file tells GitHub Actions how to run our Python application. It provisions
# a temporary Linux server, installs Python, runs our code, and importantly,
# commits the updated state.json and F-Droid repository back to the main branch.
#
# Permissions:
# It requires `contents: write` so the bot can push the updated state and APKs
# back to your repository.

name: ReleaseForge Sync

on:
  # 1. Run automatically every day at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  
  # 2. Allow manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update-releases:
    name: Fetch & Publish Updates
    runs-on: ubuntu-latest
    
    # Grant the automatically provided GITHUB_TOKEN permission to push commits
    permissions:
      contents: write

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history just in case we need it for commit tracking
          fetch-depth: 0

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip dependencies to speed up future runs
          cache: "pip"

      - name: 📦 Install System Dependencies
        run: |
          sudo apt-get update
          # fdroidserver requires Android build tools (aapt, apksigner).
          # The ubuntu-latest runner already has Android SDK installed, 
          # but we need the fdroidserver CLI itself.
          sudo apt-get install -y fdroidserver

      - name: 📚 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run ReleaseForge
        env:
          # The standard GitHub token for querying the GitHub API (1000 req/hr)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Your Telegram Bot Token (Must be added in Repo Settings -> Secrets)
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python main.py

      - name: 💾 Commit and Push State
        run: |
          # Configure git to commit as the official GitHub Actions bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add the state tracking file
          git add state.json
          
          # Add the F-Droid repository folder (if it exists and was modified)
          if [ -d "fdroid_repo" ]; then
            git add fdroid_repo/
          fi
          
          # Check if there are actually any changes to commit.
          # If main.py didn't find any new updates, git diff will be quiet.
          if git diff --staged --quiet; then
            echo "No updates found. Nothing to commit."
          else
            git commit -m "🤖 auto: update releases, state, and f-droid index"
            git push
            echo "Changes successfully pushed to repository."
          fi
